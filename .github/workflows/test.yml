# 持续集成：每次推送或提交 PR 时，在 GitHub 的云端机器上启动 MySQL 和 Redis，跑全部后端测试。
name: 后端测试

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:   # 允许在 Actions 页面手动触发

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.4            # 与本地开发环境的 MySQL 8.4 保持一致
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: backend

    # 配置通过环境变量传入（优先级高于 .env），测试会自动改用 ry-vue-test 库和 Redis db 1
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      JWT_SECRET: ci-only-secret-at-least-32-bytes-long-0000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行测试
        run: pytest -q -p no:warnings
